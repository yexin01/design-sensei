patterns:
  - id: style-editorial
    title: "Editorial design"
    category: design-style
    summary: "Magazine-style hierarchy for the web: kicker, headline, standfirst, byline, body measure, captions and rules on an asymmetric grid. Best for publications, long-form features and brand storytelling with real copy and photography."
    provenance: mixed
    tags: [editorial, magazine, serif, typography, long-form, hierarchy]
    source_ids: [astryx, fancy, taste-skill]
    frameworks: [css, react]
    dependencies: []
    implementation_status: reference_only
    use_cases: ["magazine and publication sites", "long-form journalism and essays", "case studies and annual reports", "cultural institution sites"]
    performance:
      gpu_intensity: none
      fallback_required: false
      notes: "CSS and DOM only."
    accessibility:
      motion: subtle
      reduced_motion_alternative: true
      notes: "Scroll reveals are optional; the note defines final-state rendering under reduced motion. Check text over photos with a scrim."
    source_paths:
      - astryx:packages/themes/gothic/src/gothicTheme.ts
      - astryx:docs/design/typography-hierarchy.md
