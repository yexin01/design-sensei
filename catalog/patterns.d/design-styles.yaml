    tags: [swiss, grid, international-style, neo-grotesque, typography, modular, baseline]
    source_ids: [astryx, taste-skill]
    frameworks: [css]
    dependencies: []
    implementation_status: reference_only
    use_cases: ["documentation and technical product sites", "research and institutional sites", "design and architecture studios", "event programmes and indexes"]
    performance:
      gpu_intensity: none
      fallback_required: false
      notes: "CSS only."
    accessibility:
      motion: none
      reduced_motion_alternative: true
      notes: "Motion is minimal and instant; the note removes entrance effects under reduced motion. Keep small caps labels at 12px or more and red not as sole status cue."
