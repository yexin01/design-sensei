  - id: style-neumorphism
    title: "Neumorphism"
    category: design-style
    summary: "Soft UI of paired light and dark shadows on a single-colour surface. It fails boundary contrast by default, so use it for a few hardware-like controls with borders and explicit state indicators."
    provenance: mixed
    tags: [neumorphism, soft-ui, skeuomorphic, shadow, extruded, monochrome, dial]
    source_ids: [astryx]
    frameworks: [css]
    dependencies: []
    implementation_status: reference_only
    use_cases: ["audio and smart-home control panels", "calculators and dial showpieces", "concept work with few large controls"]
    performance:
      gpu_intensity: none
      fallback_required: false
      notes: "Box-shadow only; avoid animating many shadows at once."
    accessibility:
      motion: subtle
      reduced_motion_alternative: true
      notes: "State swaps are instant under reduced motion. Shadow-defined boundaries fail 3:1 and vanish in forced-colors mode; add borders."
