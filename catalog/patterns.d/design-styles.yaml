    title: "Swiss / International Typographic Style"
    category: design-style
    summary: "Grid-governed layout with one neo-grotesque, flush-left ragged-right text, objective imagery and a single signal colour. Hierarchy comes from scale and alignment, not decoration; built with CSS Grid and subgrid."
