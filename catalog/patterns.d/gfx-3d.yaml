    performance:
      gpu_intensity: none
      fallback_required: false
      notes: "No WebGLRenderer is created by default and the frame loop is manual (frameloop never); it checks structure and logic, not pixels."
    accessibility:
      motion: none
      reduced_motion_alternative: false
      notes: "Not a visual pattern."
    source_paths:
      - react-three-fiber:docs/API/testing.mdx
      - react-three-fiber:packages/test-renderer/README.md
      - react-three-fiber:packages/test-renderer/markdown/rttr.md
