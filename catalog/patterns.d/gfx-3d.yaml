  - id: image-to-3d-img2threejs-pipeline
    title: Reference image to procedural Three.js model with img2threejs
    category: image-to-3d
    summary: A gated agent workflow that rebuilds the object in one reference image as a code-only Three.js factory through intake, spec, locked build passes and render review, with a resumable checklist and bounded corrections.
    provenance: upstream
    tags: [image-to-3d, img2threejs, procedural-modeling, threejs, agent-skill, reconstruction, quality-gates, product-3d]
    source_ids: [img2threejs]
    frameworks: [three, typescript, python, nodejs, react, r3f]
    dependencies: [three, img2threejs, "python>=3.10"]
    implementation_status: recipe_available
    use_cases: [product 3D from a photo, hero prop, stylized object reconstruction]
    performance:
      gpu_intensity: medium
      fallback_required: true
      notes: "Output cost follows the spec's triangle budget (up to 6000 low, up to 60000 standard, otherwise hero) with physical materials and generated canvas textures; not benchmarked. The process is token heavy, with documented estimates of 80k to 180k tokens per object."
    accessibility:
      motion: subtle
      reduced_motion_alternative: true
      notes: "The model is static unless you animate it. The recipe keeps idle animation off under prefers-reduced-motion and keeps a static poster for failures."
    source_paths:
      - img2threejs:SKILL.md
      - img2threejs:README.md
      - img2threejs:docs/ARCHITECTURE.md
      - img2threejs:docs/standard-prompts/build.md
      - img2threejs:forge/_shared/workflow_state.py
      - img2threejs:forge/stage3_build/generate_threejs_factory.py
    knowledge_doc: knowledge/components/img2threejs.md
    recipe: knowledge/implementation-recipes/image-to-3d-with-img2threejs.md
    related: [image-to-3d-review-gates-and-correction-loop, r3f-product-showcase-scene, r3f-canvas-setup]
    notes: "Best for hard-surface objects; one image cannot show hidden sides. Apache-2.0: keep the licence text, mark changes, keep notices. Docs say the emitter takes (spec, options) but the generator code emits create<Name>Model(options)."

  - id: image-to-3d-review-gates-and-correction-loop
    title: Render-versus-reference review gates for generated 3D
    category: image-to-3d
    summary: Deterministic diagnostics, multi-angle checks and one side-by-side sheet judged by agent vision decide each build pass, with exactly one action per review and hard ceilings on correction loops.
    provenance: upstream
    tags: [review-gates, quality-gates, visual-review, self-correction, comparison-sheet, divine-eye, image-to-3d, qa]
    source_ids: [img2threejs]
    frameworks: [python, three, nodejs]
    dependencies: ["python>=3.10"]
    implementation_status: reference_only
    use_cases: [verify a generated 3D model against its reference, bounded agent self-correction]
    performance:
      gpu_intensity: low
      fallback_required: false
      notes: "Runs offline in stdlib Python plus browser screenshots; no cost on the shipped page. Each review cycle is estimated at 5k to 12k model tokens."
    accessibility:
      motion: none
      reduced_motion_alternative: false
      notes: "Process pattern, not a visual one."
    source_paths:
      - img2threejs:grimoire/review/gates_reference.md
      - img2threejs:grimoire/review/self_correction.md
      - img2threejs:forge/stage4_review/diagnose_render.py
      - img2threejs:forge/stage4_review/make_comparison_sheet.py
      - img2threejs:forge/stage4_review/append_review.py
    knowledge_doc: knowledge/components/img2threejs.md
    related: [image-to-3d-img2threejs-pipeline]
    notes: "Silhouette IoU and SSIM against a photograph mostly measure framing and lighting; judge each pass with agent vision and a three-quarter render. Defaults: acceptance score 0.7, 3 corrections per pass, 6 in total."

  - id: image-to-3d-procedural-rig-animation-gates
    title: Procedural rig and animation gates for generated characters
    category: image-to-3d
    summary: A skeleton derived from the component tree, geodesic skin weights and gates G1 to G10 that prove clips actually drive the mesh, where an unmeasured gate reports unevaluated instead of passing.
    provenance: upstream
