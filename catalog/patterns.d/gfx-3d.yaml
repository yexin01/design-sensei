    source_ids: [img2threejs]
    frameworks: [three, python, typescript]
    dependencies: [three, "python>=3.10"]
    implementation_status: reference_only
    use_cases: [animated stylized character, rigged hero mascot]
    performance:
      gpu_intensity: medium
      fallback_required: true
      notes: "Skinned meshes and an animation mixer add per-frame CPU and GPU work; not measured in the sources."
    accessibility:
      motion: moderate
      reduced_motion_alternative: true
      notes: "Catalog guidance: do not play clips under prefers-reduced-motion and show the rest pose instead."
    source_paths:
      - img2threejs:grimoire/readiness/animation_contract.md
      - img2threejs:grimoire/readiness/procedural_rigging_contract.md
      - img2threejs:forge/stage5_rig/rig_gates.py
