  - id: r3f-test-renderer-unit-tests
    title: Unit-test R3F scenes with the test renderer
    category: workflow
    summary: Test scene graphs, props, pointer events and useFrame logic in Node without WebGL using @react-three/test-renderer, with create, fireEvent, advanceFrames and toGraph.
    provenance: upstream
    tags: [testing, test-renderer, jest, unit-tests, scene-graph, r3f]
    source_ids: [react-three-fiber]
    frameworks: [react, typescript, r3f, three]
    dependencies: ["@react-three/test-renderer", "@react-three/fiber", three]
    implementation_status: reference_only
