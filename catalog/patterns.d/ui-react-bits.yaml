# Patterns derived from React Bits (MIT + Commons Clause). Descriptions and paths only, no upstream code.
schema_version: 1
patterns:
  - id: react-bits-ogl-shader-backgrounds
    title: "React Bits OGL shader backgrounds"
    category: background-shader
    summary: "Full-bleed fragment-shader backdrops on the small OGL WebGL library (Aurora, DarkVeil, Galaxy, LiquidChrome and about 30 more backgrounds), installed as copy-in React components."
    provenance: upstream
    tags: [webgl, shader, ogl, background, hero, fragment-shader]
    source_ids: [react-bits]
    frameworks: [react, nextjs, typescript, javascript, tailwind, css, webgl, glsl]
    dependencies: [ogl]
    implementation_status: recipe_available
    use_cases: [hero background, landing page atmosphere, dark marketing site, section backdrop]
    performance:
      gpu_intensity: medium
      fallback_required: true
      notes: "34 of 59 backgrounds use OGL. Older single-file shaders (Aurora, DarkVeil) run a frame loop forever with no offscreen, hidden-tab or reduced-motion handling; 26 of 53 GPU backgrounds have no visibility gating at all. Renderer creation has no user-facing failure path. Wrap in the GpuSlot from the budget recipe."
    accessibility:
      motion: moderate
      reduced_motion_alternative: true
      notes: "Decorative, so wrap in aria-hidden. Only 10 of 53 GPU backgrounds read prefers-reduced-motion; the budget recipe renders a static layer instead."
    source_paths:
      - react-bits:src/ts-tailwind/Backgrounds/Aurora/Aurora.tsx
      - react-bits:src/ts-tailwind/Backgrounds/DarkVeil/DarkVeil.tsx
      - react-bits:src/ts-tailwind/Backgrounds/Galaxy/Galaxy.tsx
      - react-bits:src/ts-tailwind/Backgrounds/LiquidChrome/LiquidChrome.tsx
    knowledge_doc: knowledge/components/react-bits-catalog.md
    recipe: knowledge/implementation-recipes/react-bits-heavy-background-budget.md
    related: [react-bits-self-pausing-shader-backgrounds, react-bits-three-r3f-backgrounds, react-bits-webgpu-backgrounds, react-bits-canvas-grid-backgrounds]
    notes: "Licence: MIT plus Commons Clause. Use inside your own app only, never redistribute (see knowledge/implementation-recipes/react-bits-license-safe-usage.md)."

  - id: react-bits-self-pausing-shader-backgrounds
    title: "React Bits self-pausing shader backgrounds"
    category: background-shader
    summary: "Newer React Bits shader backgrounds that carry their own safeguards: pause offscreen and in hidden tabs, freeze under reduced motion, and expose paused, fps or pixel-ratio props (Plasma, PatternWaves, MicroSlats, GhostFibers, Threads, Iridescence)."
    provenance: upstream
    tags: [webgl, shader, background, performance, pause, reduced-motion]
    source_ids: [react-bits]
    frameworks: [react, nextjs, typescript, javascript, tailwind, css, webgl, glsl]
    dependencies: [ogl]
    implementation_status: recipe_available
    use_cases: [always-visible hero, interactive pointer backdrop, landing page atmosphere]
    performance:
      gpu_intensity: medium
      fallback_required: true
      notes: "Plasma exposes render-scale, max-DPR, target-fps and iteration props and handles context loss; PatternWaves, MicroSlats and GhostFibers add a paused prop. Threads and Iridescence use raw WebGL2 (no ogl). WebGL init failure is still silent, so keep a static fallback."
    accessibility:
      motion: moderate
      reduced_motion_alternative: true
      notes: "Plasma paints one static frame under reduced motion; PatternWaves, MicroSlats, GhostFibers, Threads and Iridescence also check the preference. Budget recipe adds a static layer for the rest."
    source_paths:
      - react-bits:src/ts-tailwind/Backgrounds/Plasma/Plasma.tsx
      - react-bits:src/ts-tailwind/Backgrounds/PatternWaves/PatternWaves.tsx
      - react-bits:src/ts-tailwind/Backgrounds/MicroSlats/MicroSlats.tsx
      - react-bits:src/ts-tailwind/Backgrounds/GhostFibers/GhostFibers.tsx
    knowledge_doc: knowledge/components/react-bits-catalog.md
    recipe: knowledge/implementation-recipes/react-bits-heavy-background-budget.md
    related: [react-bits-ogl-shader-backgrounds, react-bits-webgpu-backgrounds]
    notes: "Licence: MIT plus Commons Clause. Use inside your own app only, never redistribute (see knowledge/implementation-recipes/react-bits-license-safe-usage.md)."

  - id: react-bits-three-r3f-backgrounds
    title: "React Bits three.js and R3F backgrounds"
    category: three-scene
    summary: "Backgrounds built on three.js or React Three Fiber (Beams, Silk, Dither, Hyperspeed, LiquidEther, Ballpit, GridScan, PixelBlast): heavier scenes with bloom, post-processing or simulation, installed as copy-in components."
    provenance: upstream
    tags: [three, r3f, webgl, background, postprocessing, 3d]
    source_ids: [react-bits]
    frameworks: [react, nextjs, typescript, javascript, tailwind, css, webgl, three, r3f]
    dependencies: [three, "@react-three/fiber", "@react-three/drei", "@react-three/postprocessing", postprocessing]
    implementation_status: recipe_available
    use_cases: [one-off hero spectacle, 3D atmosphere, product landing page]
    performance:
      gpu_intensity: high
      fallback_required: true
      notes: "Beams and Silk force an always-on R3F frame loop at DPR 1 to 2 with no pause. Of ten three.js backgrounds only five observe visibility. GridScan downloads face-detection weights from a CDN even with the webcam off. PixelBlast declares an offscreen-pause prop that nothing updates. Per-component package subsets differ, read each import list."
    accessibility:
      motion: moderate
      reduced_motion_alternative: true
      notes: "Only one of the ten three.js backgrounds (Hyperspeed) reads prefers-reduced-motion and the three R3F ones none; use the budget recipe static layer. Hyperspeed warps while the pointer is held."
    source_paths:
      - react-bits:src/ts-tailwind/Backgrounds/Beams/Beams.tsx
      - react-bits:src/ts-tailwind/Backgrounds/Silk/Silk.tsx
      - react-bits:src/ts-tailwind/Backgrounds/Dither/Dither.tsx
      - react-bits:src/ts-tailwind/Backgrounds/Hyperspeed/Hyperspeed.tsx
    knowledge_doc: knowledge/components/react-bits-catalog.md
    recipe: knowledge/implementation-recipes/react-bits-heavy-background-budget.md
    related: [react-bits-ogl-shader-backgrounds, react-bits-webgpu-backgrounds]
    notes: "Licence: MIT plus Commons Clause. Use inside your own app only, never redistribute (see knowledge/implementation-recipes/react-bits-license-safe-usage.md)."

  - id: react-bits-webgpu-backgrounds
    title: "React Bits WebGPU backgrounds"
    category: background-shader
    summary: "AeroShards and ShapeWaves, the two React Bits backgrounds written for WebGPU through the vgpu package, with paused and onError props, observer gating and runtime quality adaptation."
    provenance: upstream
    tags: [webgpu, vgpu, background, shader, post-processing]
    source_ids: [react-bits]
    frameworks: [react, nextjs, typescript, javascript, tailwind, css]
    dependencies: [vgpu]
    implementation_status: recipe_available
    use_cases: [hero sculpture, premium landing page, text cutout backdrop]
    performance:
      gpu_intensity: high
      fallback_required: true
      notes: "Needs navigator.gpu, whose availability still varies by browser and device. AeroShards picks a low, medium or high tier from device memory, core count and canvas width, lowers it when frames run long and caps pixel ratio by a pixel budget. Both report failure through onError."
    accessibility:
      motion: moderate
      reduced_motion_alternative: true
      notes: "Both freeze under prefers-reduced-motion and stop pointer ripples; AeroShards root is aria-hidden and pointer-events none. The budget recipe supplies the static layer for unsupported browsers."
    source_paths:
      - react-bits:src/ts-tailwind/Backgrounds/AeroShards/AeroShards.tsx
      - react-bits:src/ts-tailwind/Backgrounds/ShapeWaves/ShapeWaves.tsx
      - react-bits:package.json
    knowledge_doc: knowledge/components/react-bits-catalog.md
    recipe: knowledge/implementation-recipes/react-bits-heavy-background-budget.md
    related: [react-bits-self-pausing-shader-backgrounds, react-bits-three-r3f-backgrounds]
    notes: "Licence: MIT plus Commons Clause. Use inside your own app only, never redistribute (see knowledge/implementation-recipes/react-bits-license-safe-usage.md)."

