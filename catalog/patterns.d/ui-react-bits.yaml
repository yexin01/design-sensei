  - id: react-bits-lightweight-text-effects
    title: "React Bits lightweight text effects"
    category: typography
    summary: "Text effects that avoid GSAP: BlurText and DecryptedText on motion, ShinyText and GradientText with no packages at all, plus CountUp, RotatingText and similar small pieces."
