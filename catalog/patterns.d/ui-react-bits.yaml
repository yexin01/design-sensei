  - id: react-bits-scroll-driven-components
    title: "React Bits scroll-driven reveals and stacks"
    category: scroll
    summary: "Scroll-triggered wrappers and layouts: AnimatedContent and FadeContent (GSAP ScrollTrigger entrances), ScrollExpand (media frame growing to full bleed) and ScrollStack (overlapping cards on Lenis)."
    provenance: upstream
    tags: [scroll, gsap, lenis, reveal, scrolltrigger]
    source_ids: [react-bits]
    frameworks: [react, nextjs, typescript, javascript, tailwind, css, gsap, lenis]
    dependencies: [gsap, lenis]
    implementation_status: recipe_available
    use_cases: [section entrances, scroll storytelling, card stack section]
    performance:
      gpu_intensity: none
      fallback_required: false
      notes: "AnimatedContent hides children until its effect runs and restarts if callback props change identity, so keep it off the LCP element. Both wrappers look for a hard-coded container id before using window. ScrollStack creates its own Lenis instance and clashes with a site-wide one."
    accessibility:
      motion: moderate
      reduced_motion_alternative: true
      notes: "None of the four checks reduced motion except ScrollExpand; wrap with MotionGate from the install recipe or skip the animation."
    source_paths:
      - react-bits:src/ts-tailwind/Animations/AnimatedContent/AnimatedContent.tsx
      - react-bits:src/ts-tailwind/Animations/FadeContent/FadeContent.tsx
