  - id: react-bits-target-cursor
    title: "React Bits target and crosshair cursors"
    category: cursor
    summary: "Custom cursors that lock onto interactive elements: TargetCursor (four corners snapping to a selector, GSAP) and Crosshair (canvas crosshair with live coordinates that measures hovered links and buttons)."
    provenance: upstream
    tags: [cursor, gsap, pointer, interaction, hover]
    source_ids: [react-bits]
    frameworks: [react, nextjs, typescript, javascript, tailwind, css, gsap]
    dependencies: [gsap]
    implementation_status: recipe_available
    use_cases: [portfolio site, creative agency site, interactive link targeting]
    performance:
      gpu_intensity: none
      fallback_required: false
      notes: "TargetCursor hides the native cursor on the whole page by default (hideDefaultCursor) and does nothing on touch or small screens by sniffing. Crosshair hides it only when asked and honours reduced motion."
    accessibility:
      motion: moderate
      reduced_motion_alternative: true
      notes: "Gate with MotionGate requireFinePointer from the install recipe and keep the native cursor as the fallback. Keyboard users get no equivalent focus indicator from these cursors."
    source_paths:
      - react-bits:src/ts-tailwind/Animations/TargetCursor/TargetCursor.tsx
      - react-bits:src/ts-tailwind/Animations/Crosshair/Crosshair.tsx
    knowledge_doc: knowledge/components/react-bits-catalog.md
    recipe: knowledge/implementation-recipes/react-bits-choose-variant-and-install.md
    related: [react-bits-webgl-cursor-trails]
    notes: "Licence: MIT plus Commons Clause. Use inside your own app only, never redistribute (see knowledge/implementation-recipes/react-bits-license-safe-usage.md)."

  - id: react-bits-webgl-cursor-trails
    title: "React Bits WebGL cursor trails"
    category: cursor
    summary: "GPU cursor effects that follow the pointer: GlowCursor (OGL light trail), SplashCursor (fluid simulation), GhostCursor (three.js ghost with bloom) and BlobCursor (liquid-metal blob)."
    provenance: upstream
    tags: [cursor, webgl, fluid, trail, pointer, three, ogl]
    source_ids: [react-bits]
    frameworks: [react, nextjs, typescript, javascript, tailwind, css, webgl, three]
    dependencies: [ogl, three]
    implementation_status: recipe_available
    use_cases: [playful brand site, creative portfolio, hero interaction]
    performance:
      gpu_intensity: high
      fallback_required: true
      notes: "SplashCursor is a fixed full-screen overlay with window listeners and a frame loop that are never cleaned up and re-runs on prop change, so mount it once at the root. GlowCursor and GhostCursor attach to their container; BlobCursor uses window pointer events."
    accessibility:
      motion: intense
      reduced_motion_alternative: true
      notes: "Only BlobCursor reads prefers-reduced-motion. Skip these entirely for reduced motion or touch using the budget recipe gate with requireFinePointer."
    source_paths:
      - react-bits:src/ts-tailwind/Animations/GlowCursor/GlowCursor.tsx
      - react-bits:src/ts-tailwind/Animations/SplashCursor/SplashCursor.tsx
      - react-bits:src/ts-tailwind/Animations/GhostCursor/GhostCursor.tsx
      - react-bits:src/ts-tailwind/Animations/BlobCursor/BlobCursor.tsx
