  - id: react-bits-gsap-text-reveals
    title: "React Bits GSAP text reveals"
    category: typography
    summary: "Scroll-triggered text reveals built on GSAP ScrollTrigger and SplitText (SplitText, ScrollReveal, ScrollFloat, Shuffle): staggered characters, words or lines entering once as the block scrolls into view."
    provenance: upstream
    tags: [text, gsap, scroll, reveal, split-text]
    source_ids: [react-bits]
    frameworks: [react, nextjs, typescript, javascript, tailwind, css, gsap]
    dependencies: [gsap, "@gsap/react"]
    implementation_status: recipe_available
    use_cases: [hero headline, section title, editorial landing page]
    performance:
      gpu_intensity: none
      fallback_required: false
      notes: "DOM only. SplitText waits for web fonts, takes text as a plain string and plays once. GSAP has its own licence terms and plugins are registered at module scope."
    accessibility:
      motion: moderate
      reduced_motion_alternative: true
      notes: "Only Shuffle checks reduced motion. The install recipe MotionGate renders the plain heading instead. Test with a screen reader because label handling of split spans was not verified."
