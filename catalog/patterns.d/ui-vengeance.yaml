# yaml-language-server: $schema=../schemas/patterns.schema.json
#
# Patterns drawn from Vengeance UI (vengeance-ui), read at the pinned commit.
# Every source_paths entry points at a file that was read. Performance and
# accessibility fields describe what the code does, not what the docs promise.
schema_version: 1
patterns:
  - id: vengeance-ui-registry-copy-paste-install
    title: "Copy-paste component install via a shadcn registry"
    category: workflow
    summary: "Ship components as registry JSON files, each embedding its source, npm dependencies and target path, that the shadcn CLI installs by URL or alias. The consumer owns and edits the code. Vengeance UI serves them from public/r through GitHub raw."
    provenance: upstream
    tags: [shadcn-registry, copy-paste, registry-json, cli, distribution]
    source_ids: [vengeance-ui]
    frameworks: [react, nextjs, tailwind, typescript]
    dependencies: [clsx, tailwind-merge]
    implementation_status: recipe_available
    use_cases:
      - "adopt one component without adding a package dependency"
      - "distribute an internal component set to many projects"
      - "let a coding agent install a component by URL"
    performance:
      gpu_intensity: none
      fallback_required: false
      notes: "No runtime cost. The cost is drift: item dependency arrays and docs install strings are hand-maintained, 24 ui items import packages they do not list, and 15 payloads differ from the in-tree files."
    accessibility:
      motion: none
      reduced_motion_alternative: false
      notes: "Not applicable to the mechanism; accessibility depends on the installed component."
    source_paths:
      - vengeance-ui:src/lib/registry.ts
      - vengeance-ui:public/r/registry.json
      - vengeance-ui:public/r/animated-button.json
      - vengeance-ui:src/app/docs/cli/page.tsx
    knowledge_doc: knowledge/components/vengeance-ui.md
    recipe: knowledge/implementation-recipes/vengeance-ui-install-and-verify-component.md
    related: [vengeance-ui-agent-skill-mcp-cli, vengeance-ui-theme-token-layer]
    notes: "Six catalog entries have no JSON file in public/r, and the 133 block items are not listed in registry.json. Run the dependency and CSS checks in the recipe after every install."

  - id: vengeance-ui-agent-skill-mcp-cli
    title: "Agent-ready library: skill, MCP server and init CLI"
    category: workflow
    summary: "Make a component library agent-ready with a short skill, an MCP server that searches a bundled index and prints install commands, and an idempotent init CLI that writes the skill, MCP config and an instruction block into a project."
    provenance: upstream
    tags: [mcp, agent-skill, cli, claude-code, cursor, component-index]
    source_ids: [vengeance-ui]
    frameworks: [typescript, javascript]
    dependencies: ["@modelcontextprotocol/sdk", zod, "@inquirer/prompts", interactive-commander]
    implementation_status: reference_only
    use_cases:
      - "design a read-only MCP tool surface for a design catalog"
      - "write a setup CLI that is safe to re-run"
      - "keep an agent skill short by moving detail behind tools"
    performance:
      gpu_intensity: none
      fallback_required: false
      notes: "The MCP server reads one bundled JSON file of about 230 KB; only get_component_source touches the network."
    accessibility:
      motion: none
      reduced_motion_alternative: false
      notes: "Not applicable. The skill tells agents to keep accessibility and reduced-motion code found in registry source, but few components have any."
    source_paths:
      - vengeance-ui:packages/mcp/src/tools.ts
      - vengeance-ui:packages/mcp/scripts/generate-index.mjs
      - vengeance-ui:packages/cli/src/init.ts
      - vengeance-ui:packages/cli/templates/skill/SKILL.md
    knowledge_doc: knowledge/components/vengeance-ui-agent-interfaces.md
    related: [vengeance-ui-registry-copy-paste-install]
    notes: "Search is whole-query substring matching with no ranking, the index is generated by hand-run script, and two install hosts appear across the agent files."

  - id: vengeance-ui-theme-token-layer
    title: "Two-layer CSS token theme for copy-paste components"
    category: design-system
    summary: "Two-layer CSS variable theme: semantic --vng-* tokens for colour, radius, spacing and transition speed feed the shadcn-style tokens through Tailwind v4 theme inline, with light and dark sets and var() fallbacks inside components so they work without the theme."
    provenance: upstream
    tags: [design-tokens, css-variables, tailwind-v4, dark-mode, shadcn, theming]
    source_ids: [vengeance-ui]
    frameworks: [tailwind, css, react, nextjs]
    dependencies: [tailwindcss, next-themes]
    implementation_status: reference_only
    use_cases:
      - "give copied components one place to change colour, radius and speed"
      - "ship an optional theme item next to the components"
      - "class-based light and dark modes in Tailwind v4"
    performance:
      gpu_intensity: none
      fallback_required: false
      notes: "Plain CSS variables. The site also sets a global transition duration on a and button."
    accessibility:
      motion: none
      reduced_motion_alternative: false
      notes: "The palette is monochrome zinc with primary equal to foreground in both modes. The library does not check contrast for accents added on top; check them yourself."
    source_paths:
      - vengeance-ui:public/r/vengeance-theme.json
      - vengeance-ui:src/app/globals.css
      - vengeance-ui:src/app/docs/theming/page.tsx
      - vengeance-ui:src/lib/utils.ts
    knowledge_doc: knowledge/components/vengeance-ui.md
    related: [vengeance-ui-registry-copy-paste-install]
    notes: "Components use fallbacks such as var(--vng-transition-speed,150ms), so they still render without the theme item. Dark mode needs the .dark class strategy."

  - id: vengeance-ui-animated-cta-buttons
    title: "Animated call-to-action buttons (shine, glow, candy)"
    category: button
    summary: "Animated call-to-action buttons: a framer-motion button with a looping shine mask and border sweep, a radial-gradient candy button, a CSS-only radial glow button driven by @property custom properties, and a hue-configurable generate button."
    provenance: upstream
    tags: [cta, button, shine, glow, framer-motion, css-property, hover]
    source_ids: [vengeance-ui]
    frameworks: [react, nextjs, tailwind, css, framer-motion]
    dependencies: [framer-motion, clsx, tailwind-merge]
    implementation_status: recipe_available
    use_cases:
      - "hero call to action on a SaaS or portfolio page"
      - "attention button for an AI generate action"
      - "hover-driven gradient button with no JavaScript animation"
    performance:
      gpu_intensity: low
      fallback_required: false
      notes: "animated-button loops a CSS-variable mask animation through framer-motion, so it repaints on the main thread forever. radial-glow-button animates typed custom properties with CSS. Not measured."
    accessibility:
      motion: moderate
      reduced_motion_alternative: true
      notes: "None of the four components checks prefers-reduced-motion; the motion-safe recipe swaps in a static button. generate-button enters its generating look on focus. The in-tree candy-button has a focus ring; the published one does not."
    source_paths:
      - vengeance-ui:src/components/ui/animated-button.tsx
      - vengeance-ui:src/components/ui/candy-button.tsx
      - vengeance-ui:src/components/ui/radial-glow-button.tsx
      - vengeance-ui:src/components/ui/generate-button.tsx
    knowledge_doc: knowledge/components/vengeance-ui.md
    recipe: knowledge/implementation-recipes/vengeance-ui-motion-safe-wrapper.md
    related: [vengeance-ui-liquid-metal-button]
    notes: "pop-button, creepy-button, corner-button and social-flip-button are siblings; pop-button has no focus style and corner-button, radial-glow-button and generate-button inject global class names through inline style tags."

  - id: vengeance-ui-liquid-metal-button
    title: "Liquid metal shader button"
    category: button
    summary: "Pill button whose border is a live WebGL liquid-metal shader from the Paper Design shaders package, with size variants, an icon slot and shader settings; the base LiquidMetal component can also fill any container."
    provenance: upstream
    tags: [shader, webgl, liquid-metal, chrome, button, paper-shaders]
    source_ids: [vengeance-ui]
    frameworks: [react, nextjs, webgl, tailwind]
    dependencies: ["@paper-design/shaders-react", clsx, tailwind-merge]
    implementation_status: recipe_available
    use_cases:
      - "premium call to action on a dark landing page"
      - "metallic frame for a single featured control"
    performance:
      gpu_intensity: medium
      fallback_required: true
      notes: "Each button mounts its own shader canvas, so use one or two per page. No offscreen pause was found in the wrapper."
    accessibility:
      motion: subtle
      reduced_motion_alternative: true
      notes: "The button sets outline-none and defines no focus style; add one. The motion-safe recipe shows a plain bordered fallback for reduced motion, low power or no WebGL."
    source_paths:
      - vengeance-ui:src/components/ui/liquid-metal.tsx
      - vengeance-ui:public/r/liquid-metal.json
      - vengeance-ui:src/components/docs/liquid-metal.tsx
    knowledge_doc: knowledge/components/vengeance-ui.md
    recipe: knowledge/implementation-recipes/vengeance-ui-motion-safe-wrapper.md
    related: [vengeance-ui-animated-cta-buttons]
    notes: "The shaders package is Apache-2.0 per the upstream lockfile (version 0.0.81)."

  - id: vengeance-ui-gooey-text-reveal
    title: "Gooey line-by-line text reveal (GSAP SplitText)"
    category: typography
    summary: "Line-by-line text reveal: GSAP SplitText splits headings or paragraphs into lines and an SVG colour-matrix goo filter plus blur resolves each line, in immediate, scroll or scrub modes. The component leaves text untouched when reduced motion is requested."
    provenance: upstream
    tags: [text-reveal, splittext, scrolltrigger, svg-filter, gooey, blur, gsap]
    source_ids: [vengeance-ui]
    frameworks: [react, nextjs, gsap, typescript]
    dependencies: [gsap, "@gsap/react"]
    implementation_status: recipe_available
    use_cases:
      - "hero headline that resolves from blur on load"
      - "section titles that reveal when scrolled into view"
      - "scroll-scrubbed pull quote"
    performance:
      gpu_intensity: low
      fallback_required: false
      notes: "Every split line gets its own filter layer with will-change: filter, so keep it to headings and short copy. The split is rebuilt on width changes and after fonts load."
    accessibility:
      motion: moderate
      reduced_motion_alternative: true
      notes: "Returns before splitting when prefers-reduced-motion matches, so text stays as authored; the disabled prop does the same. SplitText is given aria auto. Test Safari, since the sibling gooey-search turns its blur off there."
    source_paths:
      - vengeance-ui:src/components/ui/gooey-text-reveal.tsx
      - vengeance-ui:public/r/gooey-text-reveal.json
      - vengeance-ui:src/components/docs/gooey-text-reveal-demo.tsx
    knowledge_doc: knowledge/components/vengeance-ui.md
    recipe: knowledge/implementation-recipes/vengeance-ui-gooey-text-hero-nextjs.md
    related: [vengeance-ui-kinetic-text-effects]
    notes: "GSAP has its own licence, not MIT. The effect depends on children identity, so a re-rendering parent replays the reveal."

  - id: vengeance-ui-kinetic-text-effects
    title: "Kinetic text effects (stagger, flip-fade, count-up, morph)"
    category: typography
    summary: "Small kinetic text components: masked word or letter slide-up on scroll, per-letter flip and fade word cycling, spring count-up stats, and a blur-morph word rotator built on an SVG threshold filter."
    provenance: upstream
    tags: [text-animation, stagger, count-up, flip, morph, framer-motion, svg-filter]
    source_ids: [vengeance-ui]
    frameworks: [react, nextjs, framer-motion, css]
    dependencies: [framer-motion, clsx, tailwind-merge]
    implementation_status: recipe_available
    use_cases:
      - "headline that slides up word by word on view"
      - "rotating keyword in a hero"
      - "stat counters that count up when scrolled to"
    performance:
      gpu_intensity: low
      fallback_required: false
      notes: "stats-counter updates React state on every spring frame. flip-fade-text and morph-text loop forever. morph-text pulls Space Grotesk from Google Fonts at runtime through a CSS import."
    accessibility:
      motion: moderate
      reduced_motion_alternative: true
      notes: "None of the four handles reduced motion or adds labels to split text. morph-text keeps every word in the DOM at opacity 0. The motion-safe recipe covers plain-text fallbacks and a CSS override for one-shot reveals."
    source_paths:
      - vengeance-ui:src/components/ui/staggerText.tsx
      - vengeance-ui:src/components/ui/flip-fade-text.tsx
      - vengeance-ui:src/components/ui/stats-counter.tsx
      - vengeance-ui:src/components/ui/morph-text.tsx
    knowledge_doc: knowledge/components/vengeance-ui.md
    recipe: knowledge/implementation-recipes/vengeance-ui-motion-safe-wrapper.md
    related: [vengeance-ui-gooey-text-reveal]
    notes: "stagger-text accepts string children only and its file is named staggerText.tsx. flip-text, a CSS 3D per-character flip, needs .flip-char rules from the site's globals.css."

  - id: vengeance-ui-landing-navbars
    title: "Landing navbars: spotlight pill, notch header, mega menu"
    category: navigation
    summary: "Three landing-page navbars: a pill with a cursor-following spotlight and spring-moved active glow, a notch-cutout header drawn with SVG outlines, and a SaaS mega menu with rich dropdowns and a mobile dialog."
    provenance: upstream
    tags: [navbar, spotlight, mega-menu, notch, mobile-menu, glass]
    source_ids: [vengeance-ui]
    frameworks: [react, nextjs, tailwind, framer-motion]
    dependencies: [framer-motion, lucide-react, next-themes, clsx, tailwind-merge]
    implementation_status: reference_only
    use_cases:
      - "marketing site header with dropdown groups"
      - "floating pill navigation for a one-page site"
    performance:
      gpu_intensity: low
      fallback_required: false
      notes: "The spotlight updates a CSS variable on pointer move and springs it back on leave. The pill background uses a small backdrop blur."
    accessibility:
      motion: subtle
      reduced_motion_alternative: false
      notes: "mega-menu-navbar has expanded and controls attributes, Escape handling, a labelled mobile dialog and focus rings. spotlight-navbar anchors call preventDefault, so navigation must come from onItemClick, and the spotlight is pointer only."
    source_paths:
      - vengeance-ui:src/components/ui/spotlight-navbar.tsx
      - vengeance-ui:src/components/ui/notch-navbar.tsx
      - vengeance-ui:src/components/ui/mega-menu-navbar.tsx
      - vengeance-ui:public/r/mega-menu-navbar.json
    knowledge_doc: knowledge/components/vengeance-ui.md
    related: [vengeance-ui-floating-dock-navigation]
    notes: "The published mega-menu-navbar is self-contained, while the in-tree file imports a site logo. notch-navbar imports site modules (theme-toggle, logo-icon) and next/link; spotlight-navbar needs three global CSS classes and uses styled-jsx."

