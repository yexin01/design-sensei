    frameworks: [react, nextjs, tailwind, framer-motion]
    dependencies: [framer-motion, "@phosphor-icons/react", react-icons, lucide-react]
    implementation_status: recipe_available
    use_cases:
      - "feature section of a SaaS landing page"
      - "pricing and brand showcase grid"
      - "cards that expand into a detail overlay"
