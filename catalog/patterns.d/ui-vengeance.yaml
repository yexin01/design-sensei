  - id: vengeance-ui-aurora-hero-backgrounds
    title: "Aurora and SVG hero backgrounds"
    category: hero
    summary: "Decorative hero backgrounds: an aurora stripe gradient with a fluted-glass SVG displacement title, the same stripes as a background that needs two global CSS rules, morphing SVG blobs, and animated SVG light streaks."
    provenance: upstream
    tags: [hero, aurora, gradient, svg-filter, background, blend-mode]
    source_ids: [vengeance-ui]
    frameworks: [react, nextjs, tailwind, css, svg]
    dependencies: [framer-motion, clsx, tailwind-merge]
    implementation_status: recipe_available
    use_cases:
      - "full-bleed hero behind a headline"
      - "animated section background"
    performance:
      gpu_intensity: low
      fallback_required: false
      notes: "Large blurred layers with mix-blend-mode and backdrop-filter, a 60 second background drift, seven morphing SVG paths and an SVG light animation driven by requestAnimationFrame. Not measured; test on low-end phones."
    accessibility:
      motion: moderate
      reduced_motion_alternative: true
      notes: "No reduced-motion handling in any of the four. aurora-hero draws its title with blend modes, so contrast depends on the backdrop. The motion-safe recipe falls back to a static gradient."
