  - id: vengeance-ui-three-js-scenes
    title: "Three.js and R3F interactive scenes"
    category: three-scene
    summary: "Interactive Three.js and react-three-fiber scenes packaged as components: a scroll-driven shader dissolve between two images, an image-sampled GPU particle field, a procedural 3D book showcase, and a cursor-driven wave grid."
    provenance: upstream
    tags: [three, r3f, webgl, glsl, shader, scroll-driven, particles]
    source_ids: [vengeance-ui]
    frameworks: [react, nextjs, three, r3f, webgl, glsl]
    dependencies: [three, "@react-three/fiber", "@react-three/drei", gsap, framer-motion]
    implementation_status: recipe_available
    use_cases:
      - "scroll-driven image transition in a story page"
      - "interactive background or hero particle effect"
      - "3D product or book shelf showcase"
    performance:
      gpu_intensity: high
      fallback_required: true
      notes: "scroll-dissolve-reveal renders on demand at dpr 1. interactive-particles caps at 30 fps and stops offscreen. books-showcase lowers pixel ratio and antialiasing on low-power devices and prints a message without WebGL. wave-grid-background runs a post-processing chain and its loop has no offscreen pause."
