    category: product-showcase
    summary: "Image carousels with depth: spring-driven perspective and diagonal carousels with ARIA region and arrow keys, a pure-CSS cylinder that rotates continuously, and a GSAP ring gallery of 150 cards by default with drag, parallax tilt and a centre preview."
    provenance: upstream
    tags: [carousel, gallery, 3d-transform, perspective, drag, showcase]
    source_ids: [vengeance-ui]
    frameworks: [react, nextjs, tailwind, framer-motion, gsap, css]
    dependencies: [framer-motion, gsap, lucide-react]
    implementation_status: recipe_available
    use_cases:
      - "product or portfolio image showcase"
      - "hero gallery with an idle rotation"
    performance:
      gpu_intensity: low
      fallback_required: false
      notes: "CSS 3D transforms only. circular-gallery defaults to 150 img elements without lazy loading but pauses offscreen and when the tab is hidden. cylinder-carousel has no JSON in the registry."
    accessibility:
      motion: moderate
      reduced_motion_alternative: true
      notes: "perspective and diagonal carousels have a labelled region, arrow keys and aria-current. circular-gallery only stops its auto-rotation for reduced motion and is pointer-only. cylinder-carousel slows to one turn per 128 seconds. The motion-safe recipe gives a scroll-snap row fallback."
    source_paths:
      - vengeance-ui:src/components/ui/perspective-carousel.tsx
      - vengeance-ui:src/components/ui/diagonal-carousel.tsx
      - vengeance-ui:src/components/ui/cylinder-carousel.tsx
      - vengeance-ui:src/components/ui/circular-gallery.tsx
