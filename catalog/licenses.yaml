# License policy and review ledger. Heuristic detection only - NOT legal advice.
# `policy` is hand-written. `reviews` is maintained with:
#   design-sensei licenses scan --write
# which records what was found in each local clone at its pinned commit; human
# fields (restrictions, notes, review_status, attribution_required) are preserved.
schema_version: 1
policy:
  spdx:
    MIT:
      class: permissive
      requires:
        - keep the copyright notice
        - keep the license text
    Apache-2.0:
      class: permissive
      requires:
        - keep the copyright notice
        - keep the license text
        - state significant changes
        - keep the NOTICE file if present
    BSD-2-Clause:
      class: permissive
      requires:
        - keep the copyright notice
        - keep the license text
    BSD-3-Clause:
      class: permissive
      requires:
        - keep the copyright notice
        - keep the license text
        - do not use the author's name to endorse derived products
    ISC:
      class: permissive
      requires:
        - keep the copyright notice
        - keep the license text
    Unlicense:
      class: public_domain
      requires: []
    CC0-1.0:
      class: public_domain
      requires: []
    MPL-2.0:
      class: weak_copyleft
      requires:
        - share modifications to MPL-covered files under MPL-2.0
        - keep the license text
    LGPL-3.0:
      class: weak_copyleft
      requires:
        - see the license text; linking and modification rules apply
    GPL-2.0:
      class: strong_copyleft
      requires:
        - derivative works must be released under the same license
    GPL-3.0:
      class: strong_copyleft
      requires:
        - derivative works must be released under the same license
    AGPL-3.0:
      class: strong_copyleft
      requires:
        - derivative works and network use must follow the same license
    CC-BY-4.0:
      class: permissive
      requires:
        - give attribution
        - indicate changes
    CC-BY-NC-4.0:
      class: restricted
      requires:
        - non-commercial use only
    LicenseRef-MIT-Commons-Clause:
      class: restricted
      requires:
        - do not sell
        - sublicense or redistribute the components themselves
        - keep the copyright notice
    LicenseRef-GSAP-Standard-No-Charge:
      class: restricted
      requires:
        - custom license
        - read https://gsap.com/standard-license before use
    LicenseRef-Proprietary-Animmaster:
      class: restricted
      requires:
        - paid license
        - no redistribution
  unknown_handling: |
    A license that is missing, custom or not in this table is treated as reference only: the source may be read locally, but its code and assets must not be copied or redistributed until a person has read the license text and recorded the outcome in the review entry.
