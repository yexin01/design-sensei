    last_checked: "2026-10-09"
    inspection_status: "inspected_local"
    notes: >
      The GitHub repository is greensock/GSAP (canonical casing); the supplied
      lowercase URL redirects to it. There is no LICENSE file in the repository:
      package.json states "Standard 'no charge' license: https://gsap.com/standard-license"
      and the README links the same page. That license is custom, not an OSI open
      source license, so GitHub reports no license. The terms page was read on
      2026-10-09: it grants a non-exclusive license to use GSAP on websites and
      applications, prohibits use in visual no-code animation builders that
      compete with Webflow, and states that Webflow owns the software and may amend
      the terms. Use the published npm package, do not copy or bundle GSAP source
      into other repositories, and read the current terms at
      gsap.com/standard-license.
