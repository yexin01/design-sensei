# yaml-language-server: $schema=schemas/sources.schema.json
#
# Canonical registry of upstream sources (see docs/source-management.md).
#
#  * Every value below was either read from the upstream project at the pinned
#    commit or is explicitly marked pending_verification / unknown.
#  * This file only describes upstream material. Nothing listed here is copied
#    into this repository: git sources are cloned on the user's machine into the
#    local library (sources/ or ~/.design-sensei/sources/), reference_only sources
#    are never downloaded.
#  * Dates are quoted on purpose (the catalog YAML dialect rejects ambiguous
#    plain scalars, see scripts/dslib/yamlite.py).
#
# Update a pin with:  design-sensei sources sync <id> --update --write-pins
schema_version: 1
sources:
